name: Build and Push Docker image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'deployment.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate timestamp tag
        run: echo "VERSION=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/python-pro:${{ env.VERSION }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/python-pro:${{ env.VERSION }}

      - name: Update deployment.yaml image
        run: |
          sed -i -E "s|image: .*python-pro:[^[:space:]]+|image: ${{ secrets.DOCKERHUB_USERNAME }}/python-pro:${{ env.VERSION }}|" deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ env.VERSION }}" || echo "No changes to commit"
          git push

